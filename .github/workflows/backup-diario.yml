name: Backup Diário PocketBase → Google Drive

on:
  schedule:
    - cron: '0 3 * * *'  # 00:00 BRT (UTC-3)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: |
          curl https://rclone.org/install.sh | sudo bash
          pip install requests --quiet

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Backup completo PocketBase
        run: |
          AUTH=$(curl -sf -X POST "https://api.financascasa.online/api/admins/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"${{ secrets.PB_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.PB_ADMIN_PASSWORD }}\"}")
          TOKEN=$(echo "$AUTH" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Erro na autenticação PocketBase"; exit 1
          fi
          echo "PB_TOKEN=$TOKEN" >> $GITHUB_ENV

          BACKUP_NAME="completo-$(date +%Y%m%d-%H%M%S).zip"
          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV

          curl -sf -X POST "https://api.financascasa.online/api/backups" \
            -H "Authorization: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$BACKUP_NAME\"}"
          sleep 15

          curl -sf -L -o "$BACKUP_NAME" \
            "https://api.financascasa.online/api/backups/$BACKUP_NAME" \
            -H "Authorization: $TOKEN"

          FOLDER="backups-financascasa/completo/$(date +%Y/%m)"
          rclone copy "$BACKUP_NAME" "gdrive:$FOLDER/"
          echo "✓ Backup completo enviado: $FOLDER/$BACKUP_NAME"

      - name: Exportar dados por sistema e usuário
        env:
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, zipfile
          from datetime import datetime
          from collections import defaultdict

          BASE = "https://api.financascasa.online"
          auth = requests.post(f"{BASE}/api/admins/auth-with-password",
            json={"identity": os.environ["PB_ADMIN_EMAIL"], "password": os.environ["PB_ADMIN_PASSWORD"]})
          TOKEN = auth.json().get("token","")
          if not TOKEN:
            raise Exception("Falha na autenticação PocketBase")
          H = {"Authorization": TOKEN}

          def fetch_all(col):
            items, page = [], 1
            while True:
              r = requests.get(f"{BASE}/api/collections/{col}/records",
                headers=H, params={"perPage": 200, "page": page, "skipTotal": "false"})
              if r.status_code != 200:
                break
              data = r.json()
              batch = data.get("items", [])
              items.extend(batch)
              if len(items) >= data.get("totalItems", 0) or not batch:
                break
              page += 1
            return items

          # Descobrir coleções de cada sistema dinamicamente
          all_cols_resp = requests.get(f"{BASE}/api/collections", headers=H, params={"perPage": 200})
          all_col_names = [c["name"] for c in all_cols_resp.json().get("items", [])]

          SKIP = {"accounts","signup_requests"}
          systems = {
            "financas": [c for c in ["entries","groups","members","goals"] if c in all_col_names],
            "gado":     [c for c in all_col_names if c.startswith("gado_")     and not any(c.endswith(s) for s in SKIP)],
            "obras":    [c for c in all_col_names if c.startswith("obras_")    and not any(c.endswith(s) for s in SKIP)],
            "outdoor":  [c for c in all_col_names if c.startswith("outdoor_")  and not any(c.endswith(s) for s in SKIP)],
          }

          date_str = datetime.now().strftime("%Y%m%d-%H%M%S")

          for system, cols in systems.items():
            if not cols:
              print(f"⚠ {system}: nenhuma coleção encontrada, pulando")
              continue
            user_data = defaultdict(lambda: defaultdict(list))
            total = 0
            for col in cols:
              records = fetch_all(col)
              for rec in records:
                owner = rec.get("ownerEmail", "sem-dono")
                user_data[owner][col].append(rec)
                total += 1

            zip_name = f"backup-{system}-{date_str}.zip"
            with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for owner, col_data in user_data.items():
                for col, records in col_data.items():
                  zf.writestr(f"{owner}/{col}.json",
                    json.dumps(records, indent=2, ensure_ascii=False))

            print(f"✓ {zip_name}: {len(user_data)} usuário(s), {total} registros")

          PYEOF

      - name: Upload dos backups por sistema
        run: |
          FOLDER="backups-financascasa"
          DATE_FOLDER="$(date +%Y/%m)"
          for f in backup-*.zip; do
            SYSTEM=$(echo "$f" | sed 's/backup-\([^-]*\)-.*/\1/')
            rclone copy "$f" "gdrive:$FOLDER/$SYSTEM/$DATE_FOLDER/"
            echo "✓ $f → Drive:$FOLDER/$SYSTEM/$DATE_FOLDER/"
          done

      - name: Apagar backup do servidor PocketBase (liberar espaço)
        run: |
          curl -sf -X DELETE "https://api.financascasa.online/api/backups/$BACKUP_NAME" \
            -H "Authorization: $PB_TOKEN"
          echo "✓ Backup apagado do servidor: $BACKUP_NAME"

      - name: Limpar backups com mais de 30 dias no Drive
        run: |
          rclone delete "gdrive:backups-financascasa/" --min-age 31d
          echo "✓ Limpeza de backups antigos no Drive concluída"

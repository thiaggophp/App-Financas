name: Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/financascasa
            git pull
            npm install
            npm run build
            BUILD_TS=$(date +%s)
            sed -i "s/const CACHE=\"[^\"]*\"/const CACHE=\"financas-${BUILD_TS}\"/" dist/sw.js
            cp -r dist/* /var/www/html/
            systemctl reload nginx
            echo "Deploy concluído! Cache SW: financas-${BUILD_TS}"

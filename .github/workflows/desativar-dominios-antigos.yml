name: Desativar domínios antigos financascasa.online (executar 1 vez)

on:
  workflow_dispatch:

jobs:
  desativar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar nginx para retornar 404 nos domínios antigos
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > /etc/nginx/sites-available/financascasa-antigos << 'NGINXEOF'
            server {
                listen 80;
                server_name financascasa.online www.financascasa.online
                            financas.financascasa.online
                            gado.financascasa.online
                            obras.financascasa.online
                            outdoor.financascasa.online
                            api.financascasa.online
                            mail.financascasa.online;
                return 301 https://$host$request_uri;
            }
            server {
                listen 443 ssl;
                server_name financascasa.online www.financascasa.online
                            financas.financascasa.online
                            gado.financascasa.online
                            obras.financascasa.online
                            outdoor.financascasa.online
                            api.financascasa.online
                            mail.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            NGINXEOF

            # Desativar configs antigas
            rm -f /etc/nginx/sites-enabled/financascasa
            rm -f /etc/nginx/sites-enabled/financascasa-root

            # Ativar config de bloqueio
            ln -sf /etc/nginx/sites-available/financascasa-antigos /etc/nginx/sites-enabled/financascasa-antigos

            nginx -t && systemctl reload nginx
            echo "✓ Domínios antigos desativados"

name: Disable Old Domains

on:
  workflow_dispatch:

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Nginx 404 para dominios antigos
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Remover todos os configs antigos do financascasa.online
            for conf in financascasa financascasa-root financas gado obras outdoor mail; do
              rm -f /etc/nginx/sites-enabled/$conf
            done

            cat > /etc/nginx/sites-available/financascasa-antigos << 'NGINXEOF'
            server {
                listen 80;
                server_name financascasa.online www.financascasa.online financas.financascasa.online api.financascasa.online;
                return 301 https://$host$request_uri;
            }
            server {
                listen 443 ssl;
                server_name financascasa.online www.financascasa.online api.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            server {
                listen 80;
                server_name financas.financascasa.online;
                return 301 https://financas.financascasa.online$request_uri;
            }
            server {
                listen 443 ssl;
                server_name financas.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/financas.financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            server {
                listen 80;
                server_name gado.financascasa.online;
                return 301 https://gado.financascasa.online$request_uri;
            }
            server {
                listen 443 ssl;
                server_name gado.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/gado.financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/gado.financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            server {
                listen 80;
                server_name obras.financascasa.online;
                return 301 https://obras.financascasa.online$request_uri;
            }
            server {
                listen 443 ssl;
                server_name obras.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/obras.financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/obras.financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            server {
                listen 80;
                server_name outdoor.financascasa.online;
                return 301 https://outdoor.financascasa.online$request_uri;
            }
            server {
                listen 443 ssl;
                server_name outdoor.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/outdoor.financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/outdoor.financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            server {
                listen 80;
                server_name mail.financascasa.online;
                return 301 https://mail.financascasa.online$request_uri;
            }
            server {
                listen 443 ssl;
                server_name mail.financascasa.online;
                ssl_certificate /etc/letsencrypt/live/mail.financascasa.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/mail.financascasa.online/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 404;
            }
            NGINXEOF

            ln -sf /etc/nginx/sites-available/financascasa-antigos /etc/nginx/sites-enabled/financascasa-antigos
            nginx -t && systemctl reload nginx
            echo "Done"

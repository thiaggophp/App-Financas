name: Migrar para vexasistemas.com.br (executar 1 vez após DNS propagar)

on:
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar nginx + SSL para vexasistemas.com.br
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # ── 1. Obter certificados SSL ──────────────────────────────────
            certbot certonly --nginx --non-interactive --agree-tos \
              -m thiago@sygmasistemas.com.br \
              -d financas.vexasistemas.com.br \
              -d gado.vexasistemas.com.br \
              -d obras.vexasistemas.com.br \
              -d outdoor.vexasistemas.com.br \
              -d api.vexasistemas.com.br \
              -d mail.vexasistemas.com.br

            echo "✓ Certificados SSL emitidos"

            # ── 2. Config nginx para vexasistemas.com.br ──────────────────
            cat > /etc/nginx/sites-available/vexasistemas << 'NGINXEOF'
            # ── financas.vexasistemas.com.br ──
            server {
                listen 80;
                server_name financas.vexasistemas.com.br;
                return 301 https://financas.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name financas.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                root /var/www/html;
                index index.html;
                location / { try_files $uri $uri/ /index.html; }
            }

            # ── gado.vexasistemas.com.br ──
            server {
                listen 80;
                server_name gado.vexasistemas.com.br;
                return 301 https://gado.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name gado.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                root /var/www/gado-html;
                index index.html;
                location / { try_files $uri $uri/ /index.html; }
            }

            # ── obras.vexasistemas.com.br ──
            server {
                listen 80;
                server_name obras.vexasistemas.com.br;
                return 301 https://obras.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name obras.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                root /var/www/obras-html;
                index index.html;
                location / { try_files $uri $uri/ /index.html; }
            }

            # ── outdoor.vexasistemas.com.br ──
            server {
                listen 80;
                server_name outdoor.vexasistemas.com.br;
                return 301 https://outdoor.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name outdoor.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                root /var/www/outdoor-html;
                index index.html;
                location / { try_files $uri $uri/ /index.html; }
            }

            # ── api.vexasistemas.com.br → PocketBase :8090 ──
            server {
                listen 80;
                server_name api.vexasistemas.com.br;
                return 301 https://api.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name api.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                client_max_body_size 50M;
                location / {
                    proxy_pass http://127.0.0.1:8090;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }

            # ── mail.vexasistemas.com.br → email-server :3001 ──
            server {
                listen 80;
                server_name mail.vexasistemas.com.br;
                return 301 https://mail.vexasistemas.com.br$request_uri;
            }
            server {
                listen 443 ssl;
                server_name mail.vexasistemas.com.br;
                ssl_certificate /etc/letsencrypt/live/financas.vexasistemas.com.br/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/financas.vexasistemas.com.br/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            }
            NGINXEOF

            ln -sf /etc/nginx/sites-available/vexasistemas /etc/nginx/sites-enabled/vexasistemas

            # ── 3. Atualizar VITE_PB_URL nos .env do VPS ─────────────────
            for ENV_FILE in \
              /var/www/financascasa/.env \
              /var/www/gado-controle/.env \
              /var/www/obras-controle/.env \
              /var/www/outdoor-controle/.env; do
              if [ -f "$ENV_FILE" ]; then
                sed -i 's|https://api\.financascasa\.online|https://api.vexasistemas.com.br|g' "$ENV_FILE"
                echo "✓ Atualizado: $ENV_FILE"
              fi
            done

            # ── 4. Testar e recarregar nginx ───────────────────────────────
            nginx -t && systemctl reload nginx

            echo "✓ Migração concluída! Todos os domínios vexasistemas.com.br ativos."

      - name: Rebuild e redeploy de todos os apps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rebuild() {
              local DIR=$1
              local DEST=$2
              if [ -d "$DIR" ]; then
                cd "$DIR" && npm install --silent && npm run build
                mkdir -p "$DEST"
                cp -r dist/* "$DEST/"
                echo "✓ Rebuild: $DIR → $DEST"
              fi
            }
            rebuild /var/www/financascasa      /var/www/html
            rebuild /var/www/gado-controle     /var/www/gado-html
            rebuild /var/www/obras-controle    /var/www/obras-html
            rebuild /var/www/outdoor-controle  /var/www/outdoor-html
            systemctl reload nginx
            echo "✓ Todos os apps rebuiltados com nova API URL"

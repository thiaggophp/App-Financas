name: Remover chave SSH temporária (executar 1 vez)

on:
  workflow_dispatch:

jobs:
  remove-key:
    runs-on: ubuntu-latest
    steps:
      - name: Remover chave claude-temp do authorized_keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sed -i '/claude-temp/d' ~/.ssh/authorized_keys
            echo "Chaves restantes:"
            grep -c "" ~/.ssh/authorized_keys
            echo "✓ Chave claude-temp removida"

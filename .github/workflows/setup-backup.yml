name: Setup Backup (executar 1 vez)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets necessários
        run: |
          if [ -z "${{ secrets.RCLONE_CONF_B64 }}" ]; then
            echo "ERRO: secret RCLONE_CONF_B64 não configurado"
            exit 1
          fi
          if [ -z "${{ secrets.PB_ADMIN_EMAIL }}" ]; then
            echo "ERRO: secret PB_ADMIN_EMAIL não configurado"
            exit 1
          fi
          if [ -z "${{ secrets.PB_ADMIN_PASSWORD }}" ]; then
            echo "ERRO: secret PB_ADMIN_PASSWORD não configurado"
            exit 1
          fi
          echo "✓ Todos os secrets estão configurados"

      - name: Testar autenticação PocketBase
        run: |
          AUTH=$(curl -sf -X POST "https://api.financascasa.online/api/admins/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"${{ secrets.PB_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.PB_ADMIN_PASSWORD }}\"}")
          TOKEN=$(echo "$AUTH" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERRO: falha na autenticação PocketBase — verifique PB_ADMIN_EMAIL e PB_ADMIN_PASSWORD"
            exit 1
          fi
          echo "✓ PocketBase autenticado com sucesso"

      - name: Testar rclone + Google Drive
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone lsd gdrive: 2>&1 || { echo "ERRO: rclone não conseguiu acessar o Google Drive — verifique RCLONE_CONF_B64"; exit 1; }
          echo "✓ Google Drive acessível via rclone"
          rclone mkdir "gdrive:financascasa-backups"
          echo "✓ Pasta financascasa-backups criada/verificada no Drive"

name: VPS Fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-fix.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar chave temporária e diagnosticar VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== ADICIONANDO CHAVE TEMPORARIA ==="
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIODRB5ffJMRnXVh7tcPn0zky7gHHCXo2S8EwOnbXanAj claude-temp" >> /root/.ssh/authorized_keys
            echo "=== NGINX STATUS ==="
            systemctl is-active nginx
            nginx -t 2>&1
            echo "=== SITES ENABLED ==="
            ls -la /etc/nginx/sites-enabled/
            echo "=== SITES AVAILABLE ==="
            ls -la /etc/nginx/sites-available/
            echo "=== CONTEUDO SITES-ENABLED ==="
            for f in /etc/nginx/sites-enabled/*; do echo "--- $f ---"; cat "$f"; done
            echo "=== PROCESSOS NA PORTA 80/443 ==="
            ss -tlnp | grep -E ':80|:443'
            echo "=== POCKETBASE RODANDO? ==="
            systemctl is-active pocketbase 2>/dev/null || ps aux | grep pocketbase | grep -v grep
            echo "=== CERTIFICADOS SSL ==="
            ls /etc/letsencrypt/live/ 2>/dev/null
            echo "=== PASTA WWW ==="
            ls /var/www/
            echo "=== NGINX ERROR LOG (ultimas 30 linhas) ==="
            tail -30 /var/log/nginx/error.log 2>/dev/null
